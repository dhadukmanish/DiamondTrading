# Production stack: web (nginx + static build + /api proxy) → api (Fastify) → db (Postgres)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-erp}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp}"], interval: 5s, retries: 10 }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-erp}:${DB_PASSWORD}@db:5432/${DB_NAME:-erp}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 4000
      CORS_ORIGIN: ${APP_URL:-http://localhost}
      NODE_ENV: production
    depends_on: { db: { condition: service_healthy } }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    ports: ["${WEB_PORT:-80}:80"]
    depends_on: [api]

volumes:
  pgdata:
